services:

  # ── API GATEWAY ───────────────────────────
  nginx:
    image: nginx:stable-alpine
    container_name: logiflow_gateway
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # ── FRONTEND ──────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: ../frontend/deployment/Dockerfile
    container_name: logiflow_frontend
    restart: unless-stopped
    depends_on:
      - seaweedfs

  # ── BACKEND ───────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: ../backend/deployment/Dockerfile
    container_name: logiflow_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.backend

  # ── DATABASE ──────────────────────────────
  db:
    image: postgres:17-alpine
    container_name: logiflow_db
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── PGADMIN ───────────────────────────────
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: logiflow_pgadmin
    restart: unless-stopped
    env_file:
      - .env.pgadmin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  # ── S3 STORAGE ────────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:4.20
    container_name: logiflow_s3_storage
    ports:
      - "8333:8333"
      - "23646:23646"
    command: "mini -dir=/data"
    volumes:
      - s3_data:/data
    restart: unless-stopped

  s3-init:
    image: amazon/aws-cli:2.34.30
    container_name: logiflow_s3_init
    depends_on:
      - seaweedfs
    environment:
      - AWS_ACCESS_KEY_ID=dummykey
      - AWS_SECRET_ACCESS_KEY=dummysecret
      - AWS_DEFAULT_REGION=us-east-1
    volumes:
      - ../frontend/deployment/policy.json:/tmp/policy.json
      - ../frontend/public:/tmp/public
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      sleep 5;
      aws --endpoint-url http://seaweedfs:8333 s3 mb s3://public-images || true;
      aws --endpoint-url http://seaweedfs:8333 s3api put-bucket-policy --bucket public-images --policy file:///tmp/policy.json;
      aws --endpoint-url http://seaweedfs:8333 s3 sync /tmp/public s3://public-images --delete;
      echo 'S3 Bucket initialized successfully!';
      "

volumes:
  postgres_data:
  pgadmin_data:
  s3_data:
