images:
  backend:
    repository: ghcr.io/maksim0403/devops-labs-backend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/maksim0403/devops-labs-frontend
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  postgres:
    repository: postgres
    tag: "17-alpine"
    pullPolicy: IfNotPresent

backend:
  replicas: 2
  containerPort: 8000
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicas: 2
  containerPort: 80
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  replicas: 1
  containerPort: 5432
  service:
    port: 5432
  persistence:
    enabled: true
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

migration:
  backoffLimit: 10
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

config:
  DEBUG: "false"
  DB_NAME: logiflow
  DB_USER: logiflow
  ALGORITHM: HS256
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  COOKIE_SECURE: "false"
  CORS_ORIGINS: "http://localhost,http://127.0.0.1"
  AVERAGE_SPEED_KMH: "60.0"
  S3_ENDPOINT_URL: "http://seaweedfs:8333"
  S3_BUCKET_NAME: logiflow-storage
  S3_REGION: us-east-1

# These are dummy credentials for local coursework only, not production secrets.
secret:
  DB_PASSWORD: "not-a-real-password"
  SECRET_KEY: "not-a-real-secret-key-change-me-0123456789abcdef"
  S3_ACCESS_KEY: "not-a-real-access-key"
  S3_SECRET_KEY: "not-a-real-s3-secret"

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []

helmTest:
  enabled: true
