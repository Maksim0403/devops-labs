apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "logiflow.fullname" . }}-migrate
  labels:
    {{- include "logiflow.labels" (dict "root" . "name" "migration") | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "logiflow.labels" (dict "root" . "name" "migration") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: "{{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}"
          imagePullPolicy: {{ .Values.images.backend.pullPolicy }}
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: {{ include "logiflow.configMap" . }}
            - secretRef:
                name: {{ include "logiflow.secret" . }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
