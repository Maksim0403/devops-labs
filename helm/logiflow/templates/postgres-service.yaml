apiVersion: v1
kind: Service
metadata:
  name: {{ include "logiflow.databaseHost" . }}
  labels:
    {{- include "logiflow.labels" (dict "root" . "name" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - port: {{ .Values.postgres.service.port }}
      targetPort: {{ .Values.postgres.containerPort }}
