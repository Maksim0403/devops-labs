apiVersion: v1
kind: Secret
metadata:
  name: {{ include "logiflow.secret" . }}
  labels:
    {{- include "logiflow.labels" (dict "root" . "name" "secret") | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.secret.DB_PASSWORD | quote }}
  SECRET_KEY: {{ .Values.secret.SECRET_KEY | quote }}
  S3_ACCESS_KEY: {{ .Values.secret.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.secret.S3_SECRET_KEY | quote }}
