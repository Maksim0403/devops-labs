name: CI

on:
  push:
    branches: ['**']        # push у будь-яку гілку
  pull_request:             # зміни в PR

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------- Пункти 2 і 3: backend ----------
  backend:
    name: ci-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEBUG: 'false'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_NAME: logiflow_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      SECRET_KEY: ci-test-secret-key-at-least-32-bytes-long
      COOKIE_SECURE: 'false'
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://localhost:8333
      S3_ACCESS_KEY: any
      S3_SECRET_KEY: any
      S3_BUCKET_NAME: logiflow-test-bucket
      S3_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Start SeaweedFS (S3 для тестів)
        run: |
          docker run -d --name seaweedfs -p 8333:8333 chrislusf/seaweedfs server -s3
          sleep 15

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.14'
          enable-cache: true                       # кеш залежностей
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (Ruff)                          # блокуючий лінтер
        run: uv run ruff check . --output-format=github

      - name: Build (перевірка компіляції)
        run: uv run python -m compileall -q app

      - name: Test (pytest)
        run: uv run pytest

  # ---------- Пункти 2 і 3: frontend ----------
  frontend:
    name: ci-frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                               # кеш залежностей
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint + ESLint)               # блокуючий лінтер
        run: |
          npx oxlint .
          npx eslint .

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:unit --if-present

  # ---------- Пункт 4: образи + сканування ----------
  docker-build:
    name: docker-build (${{ matrix.service }})
    needs: [backend, frontend]                     # залежить від усіх build/test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend,  context: backend,  dockerfile: backend/deployment/Dockerfile }
          - { service: frontend, context: frontend, dockerfile: frontend/deployment/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image (локально, без публікації)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: local/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (блокуючий)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: local/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

  # ---------- Пункт 5: публікація в GHCR ----------
  publish:
    name: publish (${{ matrix.service }})
    needs: docker-build
    if: github.event_name == 'push'                # тільки push, не PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: backend,  context: backend,  dockerfile: backend/deployment/Dockerfile }
          - { service: frontend, context: frontend, dockerfile: frontend/deployment/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devops-labs-${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}    # секрет CI, не в репозиторії

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}