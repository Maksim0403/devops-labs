apiVersion: v1
kind: Secret
metadata:
  name: logiflow-secret
  namespace: logiflow
  labels:
    app.kubernetes.io/part-of: logiflow
type: Opaque
# Навчальні значення, не справжні паролі
stringData:
  DB_PASSWORD: "lab-db-password"
  SECRET_KEY: "lab-secret-key-change-me-0123456789abcdef"
  S3_ACCESS_KEY: "lab-access-key"
  S3_SECRET_KEY: "lab-secret-key"
