apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: logiflow
  labels:
    app: backend-migrate
    app.kubernetes.io/part-of: logiflow
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ghcr.io/maksim0403/devops-labs-backend:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: logiflow-config
            - secretRef:
                name: logiflow-secret
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
